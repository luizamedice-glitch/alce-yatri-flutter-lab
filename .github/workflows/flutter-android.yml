name: Flutter Android debug
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Flutter project
        id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
      - name: Build Android debug
        if: steps.check.outputs.exists == 'true'
        run: cd app && flutter pub get && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.exists == 'true'
        with:
          name: alce-yatri-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
