name: Android clients CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mock-api:
    name: Mock ride API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mock API
        run: cd backend/mock && npm test
  passenger:
    name: Passenger Flutter debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter Android platform
        run: |
          cd apps/passenger
          flutter create --project-name alce_yatri_passenger --platforms android .
          flutter pub get
          flutter test
      - name: Compile passenger
        run: cd apps/passenger && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: passenger-debug-apk
          path: apps/passenger/build/app/outputs/flutter-apk/app-debug.apk
  driver:
    name: Driver Kotlin debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile driver
        run: cd apps/driver && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: driver-debug-apk
          path: apps/driver/app/build/outputs/apk/debug/*.apk
